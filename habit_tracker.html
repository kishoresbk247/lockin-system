<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Lock-In System — Habit Tracker</title>
<meta name="description" content="A premium gamified habit tracker with ranks, streaks, and celebration animations. Lock in your daily habits and level up.">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c10">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock-In">
<link rel="apple-touch-icon" href="icon-512.png">
<!-- Favicon -->
<link rel="icon" type="image/png" href="icon-512.png">
</head>
<body>
<div id="app-root"></div>

<!-- API Helper Layer -->
<script>
// CHANGE THIS to your deployed backend URL (e.g. 'https://lockin-system.onrender.com')
// Leave empty for same-origin (local development)
var API_BASE = '';
function getToken(){return localStorage.getItem('lockin_token')}
function setToken(t){localStorage.setItem('lockin_token',t)}
function clearToken(){localStorage.removeItem('lockin_token')}
async function api(method,path,body){
  var h={'Content-Type':'application/json'};
  var t=getToken();
  if(t) h['Authorization']='Bearer '+t;
  var r=await fetch(API_BASE+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  var d=await r.json();
  if(!r.ok) throw new Error(d.error||'Request failed');
  return d;
}
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap');
  *,*::before,*::after{ box-sizing:border-box; }
  html{ height:100%; }
  body{
    margin:0;
    background:#0b0c10;
    min-height:100%;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    overscroll-behavior:none;
    -webkit-overflow-scrolling:touch;
  }
  :root{
    --bg:#0b0c10;
    --card:#141519;
    --card-border:#22242b;
    --text:#f2f2f5;
    --sub:#8a8d98;
    --cell-empty:#1d1f26;
    --accent:#f2c744;
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --ease-smooth:cubic-bezier(.25,.1,.25,1);
    --ease-out-expo:cubic-bezier(.19,1,.22,1);
    --ease-in-out-quint:cubic-bezier(.86,0,.07,1);
  }
  #app-root{
    background:
      radial-gradient(circle at 50% -10%, #1a1d26 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Rajdhani',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    padding:6px 16px 80px;
    box-sizing:border-box;
    max-width:480px;
    margin:0 auto;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    animation:headerSlideIn .8s var(--ease-out-expo) both;
  }
  .header h1{
    font-family:'Cinzel',serif;
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--sub);
    font-weight:800;
    margin:0;
    animation:titleGlow 4s ease-in-out infinite;
    will-change:filter;
  }
  .add-btn{
    position:relative;
    background:linear-gradient(160deg, #ffe17a, var(--accent) 55%, #c99a1e);
    color:#1a1006;
    border:1px solid rgba(0,0,0,.4);
    width:38px;
    height:38px;
    clip-path:polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
    font-family:'Rajdhani',sans-serif;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    line-height:1;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -3px 5px rgba(0,0,0,.3),
      0 3px 8px rgba(0,0,0,.4);
    transition:transform .2s var(--ease-spring), box-shadow .2s var(--ease-smooth);
    will-change:transform;
    animation:addBtnPulse 3s ease-in-out infinite;
  }
  .add-btn:hover{
    transform:translateY(-1px) scale(1.08);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -3px 5px rgba(0,0,0,.3),
      0 6px 20px rgba(242,199,68,.4);
  }
  .add-btn:active{
    transform:translateY(2px) scale(0.95);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -1px 2px rgba(0,0,0,.3),
      0 1px 3px rgba(0,0,0,.3);
    transition-duration:.08s;
  }

  .habit-card{
    position:relative;
    background:linear-gradient(180deg, #16171d, #121317);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:18px 16px 16px;
    margin-bottom:14px;
    will-change:transform,opacity;
    transform:translate3d(0,0,0);
    animation:cardEntrance .65s var(--ease-out-expo) both;
    transition:transform .35s var(--ease-smooth), box-shadow .35s var(--ease-smooth), border-color .3s ease;
  }
  .habit-card:hover{
    transform:translate3d(0,-2px,0);
    box-shadow:0 8px 32px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.04);
    border-color:#2e3038;
  }
  .habit-card::before, .habit-card::after,
  .habit-card .corner-br, .habit-card .corner-bl{
    content:"";
    position:absolute;
    width:12px; height:12px;
    border-color:rgba(255,255,255,.16);
    border-style:solid;
    border-width:0;
    pointer-events:none;
  }
  .habit-card::before{ top:-1px; left:-1px; border-top-width:2px; border-left-width:2px; border-radius:12px 0 0 0; }
  .habit-card::after{ top:-1px; right:-1px; border-top-width:2px; border-right-width:2px; border-radius:0 12px 0 0; }
  .habit-topline{
    position:absolute;
    top:0; left:14px; right:14px;
    height:2px;
    border-radius:2px;
    animation:toplineShimmer 3s ease-in-out infinite;
    will-change:opacity;
  }
  .habit-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .habit-name-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .habit-icon{
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    flex-shrink:0;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));
  }
  .habit-meta{ line-height:1.3; }
  .habit-meta .name{
    font-family:'Cinzel',serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
  }
  .habit-meta .sub{ font-size:11.5px; color:var(--sub); font-weight:500; }
  .habit-stats{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .badge{
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:7px;
    background:#1d1f26;
    color:var(--sub);
    white-space:nowrap;
  }
  .badge b{ color:var(--text); }
  .del-btn{
    background:#1a1b20;
    border:1px solid var(--card-border);
    color:#5c5f6a;
    width:26px; height:26px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
    transition:transform .25s var(--ease-spring), color .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
    will-change:transform;
  }
  .del-btn:active{ transform:scale(0.85) rotate(-10deg); transition-duration:.08s; }
  .del-btn:hover{ color:#ff6b6b; border-color:#4a2626; background:#1f1315; box-shadow:0 0 12px rgba(255,107,107,.15); }

  .stat-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .rank-badge{
    position:relative;
    display:flex;
    align-items:center;
    gap:7px;
    padding:4px 11px 4px 5px;
    border-radius:7px;
    font-family:'Rajdhani',sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:.6px;
    color:#1a1006;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    border:1px solid rgba(0,0,0,.4);
    overflow:hidden;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -3px 5px rgba(0,0,0,.25),
      0 2px 6px rgba(0,0,0,.35);
  }
  .rank-badge::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:35%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.65), transparent);
    animation:badgeSweep 3.6s ease-in-out infinite;
    pointer-events:none;
  }
  .rank-badge .rb-icon{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  .rank-badge .rb-text{ font-size:14px; position:relative; z-index:1; }
  .rank-badge .rb-name{ font-weight:800; }
  .rank-badge .rb-dot{ opacity:.55; margin:0 1px; }
  .rank-badge.conqueror{
    background-size:220% auto;
    animation:shimmerText 2.2s linear infinite;
  }
  .streak-chip{
    display:flex;
    align-items:center;
    gap:5px;
    font-family:'Rajdhani',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--text);
    background:linear-gradient(160deg, #23181155, #1d1f26);
    padding:4px 9px;
    border-radius:7px;
    border:1px solid #2c2416;
    transition:transform .25s var(--ease-spring), box-shadow .25s ease;
  }
  .streak-chip:hover{
    transform:scale(1.05);
    box-shadow:0 0 12px rgba(255,92,26,.2);
  }
  .streak-chip.bump{ animation:popScale .45s ease; }
  .streak-flame{
    position:relative;
    display:inline-block;
    font-size:13px;
    animation:flicker 1.1s ease-in-out infinite;
    filter:drop-shadow(0 0 4px #ff5c1a);
  }
  .points-chip{
    font-family:'Rajdhani',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--sub);
    background:#1d1f26;
    padding:4px 9px;
    border-radius:7px;
    border:1px solid var(--card-border);
  }

  .level-progress{
    position:relative;
    height:6px;
    border-radius:4px;
    background:var(--cell-empty);
    overflow:hidden;
    margin-bottom:12px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
  }
  .level-progress-fill{
    position:relative;
    height:100%;
    border-radius:4px;
    transition:width .6s var(--ease-out-expo);
    overflow:hidden;
    will-change:width;
  }
  .level-progress-fill::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      120deg,
      rgba(255,255,255,.35) 0 6px,
      transparent 6px 14px
    );
    animation:stripeMove 1.1s linear infinite;
  }
  .level-progress-fill::before{
    content:"";
    position:absolute; top:0; right:0; bottom:0;
    width:6px;
    background:rgba(255,255,255,.85);
    filter:blur(2px);
    animation:progressGlowPulse 1.6s ease-in-out infinite;
  }

  .grid-wrap{ position:relative; }
  .pop-plus{
    position:absolute;
    top:-8px;
    right:2px;
    font-weight:800;
    font-size:13px;
    animation:floatUp .85s ease forwards;
    pointer-events:none;
    z-index:2;
  }

  .grid{
    display:grid;
    grid-template-rows:repeat(7, 1fr);
    grid-auto-flow:column;
    grid-auto-columns:1fr;
    gap:4px;
    width:100%;
  }
  .cell{
    border-radius:3px;
    background:var(--cell-empty);
    cursor:pointer;
    border:1px solid rgba(255,255,255,.03);
    transition:transform .2s var(--ease-spring), box-shadow .25s ease, border-color .2s ease, background .3s ease;
    will-change:transform;
    transform:translate3d(0,0,0);
  }
  .cell:hover{
    transform:scale(1.25) translate3d(0,0,0);
    z-index:2;
    border-color:rgba(255,255,255,.12);
    box-shadow:0 0 8px rgba(255,255,255,.08);
  }
  .cell:active{ transform:scale(0.8) translate3d(0,0,0); transition-duration:.06s; }
  .cell.today{ animation:cellPulse 1.8s ease-in-out infinite; }
  .cell.pop{ animation:popScale .45s var(--ease-spring); }

  .empty-state{
    text-align:center;
    color:var(--sub);
    padding:60px 20px;
    font-size:13.5px;
    line-height:1.6;
    animation:emptyFadeIn 1s var(--ease-out-expo) both;
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(12px) saturate(120%);
    backdrop-filter:blur(12px) saturate(120%);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
    animation:overlayFadeIn .3s var(--ease-smooth) both;
  }
  .modal{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px 20px 0 0;
    padding:22px 18px 28px;
    width:100%;
    max-width:480px;
    box-sizing:border-box;
    animation:modalSlideUp .4s var(--ease-out-expo) both;
    will-change:transform,opacity;
  }
  .modal h2{
    font-family:'Cinzel',serif;
    font-size:16px;
    letter-spacing:1px;
    margin:0 0 16px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-family:'Rajdhani',sans-serif;
    font-size:11.5px;
    font-weight:700;
    color:var(--sub);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:1.5px;
  }
  .field input[type=text]{
    width:100%;
    background:#0b0c10;
    border:1px solid var(--card-border);
    border-radius:8px;
    padding:11px 12px;
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    font-weight:600;
    box-sizing:border-box;
    transition:border-color .25s ease, box-shadow .25s ease, transform .2s var(--ease-spring);
  }
  .field input[type=text]:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(242,199,68,.15), 0 0 20px rgba(242,199,68,.08);
    transform:scale(1.01);
  }
  .icon-row, .color-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .icon-choice{
    width:38px; height:38px;
    border-radius:9px;
    background:#0b0c10;
    border:1.5px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
  }
  .icon-choice.sel{ border-color:var(--accent); }

  .emoji-select{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0b0c10;
    border:1.5px solid var(--card-border);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
    user-select:none;
    transition:border-color .15s ease, transform .08s ease;
  }
  .emoji-select:active{ transform:scale(0.98); }
  .emoji-select .current{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
  }
  .emoji-select .current span.label{
    font-family:'Rajdhani',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--sub);
  }
  .emoji-select .chevron{
    color:var(--accent);
    font-size:11px;
    transition:transform .15s ease;
  }
  .emoji-select .chevron.open{ transform:rotate(180deg); }

  .emoji-panel{
    margin-top:8px;
    background:#0b0c10;
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:10px;
    max-height:190px;
    overflow-y:auto;
  }
  .emoji-cat-label{
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--sub);
    margin:8px 2px 6px;
  }
  .emoji-cat-label:first-child{ margin-top:0; }
  .emoji-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:4px;
  }
  .emoji-cell{
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    border-radius:8px;
    cursor:pointer;
    background:transparent;
    transition:transform .08s ease;
  }
  .emoji-cell:active{ background:#1d1f26; transform:scale(0.85); }
  .emoji-cell.sel{ background:var(--card); box-shadow:0 0 0 1.5px var(--accent), 0 0 8px rgba(242,199,68,.35); }
  .color-choice{
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    border:2.5px solid transparent;
  }
  .color-choice.sel{ border-color:#fff; }

  .color-picker{ user-select:none; }
  .sv-square{
    position:relative;
    width:100%;
    height:150px;
    border-radius:12px;
    touch-action:none;
    cursor:crosshair;
    overflow:hidden;
  }
  .sv-square .sv-white{
    position:absolute; inset:0;
    background:linear-gradient(to right, #fff, transparent);
  }
  .sv-square .sv-black{
    position:absolute; inset:0;
    background:linear-gradient(to top, #000, transparent);
  }
  .sv-handle{
    position:absolute;
    width:18px; height:18px;
    border-radius:50%;
    border:2.5px solid #fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.5);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .hue-strip{
    position:relative;
    width:100%;
    height:20px;
    margin-top:12px;
    border-radius:10px;
    touch-action:none;
    cursor:pointer;
    background:linear-gradient(to right,
      #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
  }
  .hue-handle{
    position:absolute;
    top:50%;
    width:14px; height:26px;
    border-radius:6px;
    background:#fff;
    border:1.5px solid rgba(0,0,0,.4);
    box-shadow:0 1px 4px rgba(0,0,0,.5);
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .color-preview-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
  }
  .color-preview-swatch{
    width:36px; height:36px;
    border-radius:10px;
    border:1.5px solid var(--card-border);
    flex-shrink:0;
  }
  .color-preview-hex{
    font-size:13px;
    color:var(--sub);
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .modal-actions{
    display:flex; gap:10px;
    margin-top:18px;
  }
  .modal-actions button{
    flex:1;
    padding:13px;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    border:none;
    font-family:'Rajdhani',sans-serif;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform .2s var(--ease-spring), box-shadow .2s ease, filter .2s ease;
    will-change:transform;
  }
  .cancel-btn{
    background:linear-gradient(160deg, #2a2c33, #17181d);
    color:var(--text);
    border:1px solid #33353d !important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }
  .cancel-btn:hover{ filter:brightness(1.15); transform:translateY(-1px); }
  .cancel-btn:active{ transform:translateY(2px); filter:brightness(.9); transition-duration:.06s; }
  .save-btn{
    background:linear-gradient(160deg, #ffe17a, var(--accent) 55%, #c99a1e);
    color:#1a1006;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -3px 5px rgba(0,0,0,.25),
      0 3px 10px rgba(242,199,68,.25);
  }
  .save-btn:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -3px 5px rgba(0,0,0,.25),
      0 6px 24px rgba(242,199,68,.4);
  }
  .save-btn:active:not(:disabled){
    transform:translateY(2px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -1px 2px rgba(0,0,0,.25);
    transition-duration:.06s;
  }
  .save-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .confirm-overlay{
    align-items:center;
    padding:20px;
    z-index:80;
  }
  .modal.confirm-modal{
    position:relative;
    max-width:320px;
    border-radius:16px;
    padding:26px 20px 20px;
    text-align:center;
    overflow:hidden;
    animation:confirmPopIn .4s var(--ease-spring) both;
  }
  .confirm-topline{
    position:absolute;
    top:0; left:14px; right:14px;
    height:2px;

  @keyframes flicker{
    0%,100%{ transform:scale(1) rotate(-3deg); filter:drop-shadow(0 0 2px #ff8a3d); }

  @keyframes fadeIn{
    from{ opacity:0; } to{ opacity:1; }

  @keyframes badgePopIn{

    100%{ transform:translate(-50%,-18px) scale(.95); opacity:0; filter:blur(2px); }

  @keyframes confettiFall{
    0%{ transform:translateY(-10px) rotate(0deg) scale(1); opacity:1; }

  }
  @keyframes stripeMove{
    0%{ background-position:0 0; }
    100%{ background-position:28px 0; }

  @keyframes cellPulse{
    0%,100%{ box-shadow:0 0 0 1.5px var(--pulse-color, var(--accent)); }

  @keyframes rayRotate{

  @keyframes screenFlash{
    0%{ opacity:.9; }
    100%{ opacity:0; }
  }
  @keyframes sparkleTwinkle{

  /* ====== NEW SMOOTH ANIMATIONS ====== */

  @keyframes addBtnPulse{

  @keyframes toplineShimmer{

  }
  @keyframes progressGlowPulse{

    50%{ opacity:1; width:10px; }

  @keyframes greetFadeIn{
    0%{ opacity:0; }
    100%{ opacity:1; }
  }
  @keyframes greetFadeOut{
    0%{ opacity:1; transform:scale(1); filter:blur(0); }
    100%{ opacity:0; transform:scale(1.05); filter:blur(12px); }
  }
  @keyframes greetEmojiPop{
    0%{ opacity:0; transform:scale(0.3) rotate(-20deg); }

  @keyframes greetMainPop{

  }
  @keyframes greetTapPulse{

  }

    background:radial-gradient(ellipse at 50% 30%, rgba(30,28,20,.95), rgba(8,8,12,.98) 70%);

  .auth-title{

    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    font-family:'Rajdhani',sans-serif; font-size:14.5px;

const ROMAN = {1:"I", 2:"II", 3:"III"};
const POINTS_PER_LEVEL = 3;
const LEVELS_PER_RANK = 3;
const CONFETTI_COLORS = ["#f2c744","#7c5cff","#2ecc71","#e83e9c","#4aa8ff","#ff5c5c","#a6ffe9"];

function getLevelInfo(points){
  const level = Math.floor(points/POINTS_PER_LEVEL) + 1;
  const rankIndexUncapped = Math.floor((level-1)/LEVELS_PER_RANK);
  const rankIndex = Math.min(RANKS.length-1, rankIndexUncapped);
  const subLevelRaw = (level-1) - rankIndex*LEVELS_PER_RANK + 1;
  const romanSub = ROMAN[subLevelRaw] || subLevelRaw;
  const pointsIntoLevel = points - (level-1)*POINTS_PER_LEVEL;
  const progress = pointsIntoLevel / POINTS_PER_LEVEL;
  return { level, rankIndex, rankIndexUncapped, romanSub, progress, pointsIntoLevel };
}

function ConfettiBurst({count = 30}){
  const pieces = useMemo(() => Array.from({length:count}).map((_,i) => ({
    left: Math.random()*100,
    delay: Math.random()*0.35,
    duration: 1.5 + Math.random()*1.3,
    color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
    w: 5 + Math.random()*5,
    h: 8 + Math.random()*6,
    rotate: Math.random()*360,
  })), [count]);
  return (
    <div className="confetti-wrap">
      {pieces.map((p,i) => (
        <div key={i} className="confetti-piece" style={{
          left:`${p.left}%`,
          background:p.color,
          width:p.w, height:p.h,
          animationDelay:`${p.delay}s`,
          animationDuration:`${p.duration}s`,
          transform:`rotate(${p.rotate}deg)`,
        }} />
      ))}
    </div>
  );
}

function Sparkles({count = 10}){
  const sparks = useMemo(() => Array.from({length:count}).map((_,i) => ({
    top: 10 + Math.random()*55,
    left: 10 + Math.random()*80,
    size: 8 + Math.random()*10,
    delay: Math.random()*1.6,
    duration: 1 + Math.random()*1.2,
  })), [count]);
  return sparks.map((s,i) => (
    <span key={i} className="sparkle" style={{
      top:`${s.top}%`, left:`${s.left}%`,
      fontSize:s.size,
      animationDelay:`${s.delay}s`,
      animationDuration:`${s.duration}s`,
    }}>{"\u2726"}</span>
  ));
}

function CelebrationOverlay({event, onDone}){
  useEffect(() => {
    if(!event) return;
    const dur = event.type === "rankup" ? 2700 : 1750;
    const t = setTimeout(onDone, dur);
    return () => clearTimeout(t);
  }, [event]);

  if(!event) return null;
  const rank = RANKS[event.info.rankIndex];
  const gradCss = `linear-gradient(160deg, ${rank.grad.join(", ")})`;

  if(event.type === "rankup"){
    return (
      <div className="celebrate-overlay" onClick={onDone}>
        <div className="celebrate-flash" />
        <div className="celebrate-rays" />
        <ConfettiBurst count={36} />
        <Sparkles count={12} />
        <div className="celebrate-badge-wrap">
          <div className="celebrate-badge" style={{background:gradCss}}>
            <RankIcon index={event.info.rankIndex} size={54} />
          </div>
        </div>
        <div className="celebrate-title">RANK UP</div>
        <div className="celebrate-rankname" style={{backgroundImage:`linear-gradient(90deg, ${rank.grad.join(", ")}, ${rank.grad[0]})`}}>
          {rank.name.toUpperCase()}
        </div>
        <div className="celebrate-sub">{event.habitName} {"\u2022"} Level {event.info.level}</div>
      </div>
    );
  }

  return (
    <div className="levelup-toast" style={{borderColor:event.color}}>
      <span className="levelup-flash">{"\u26A1"}</span>
      LEVEL UP {"\u2014"} Lv {event.info.level}
      <span className="levelup-rank" style={{color:rank.grad[0]}}>{rank.name} {event.info.romanSub}</span>
    </div>
  );
}

function RankBadge({info}){
  const rank = RANKS[info.rankIndex];
  const isMax = info.rankIndex === RANKS.length - 1;
  return (
    <div
      className={"rank-badge" + (isMax ? " conqueror" : "")}

function hsvToHex(h,s,v){
  s/=100; v/=100;
  const c = v*s;
  const x = c*(1-Math.abs((h/60)%2-1));
  const m = v-c;
  let r=0,g=0,b=0;
  if(h<60){ r=c;g=x;b=0; } else if(h<120){ r=x;g=c;b=0; }
  else if(h<180){ r=0;g=c;b=x; } else if(h<240){ r=0;g=x;b=c; }
  else if(h<300){ r=x;g=0;b=c; } else { r=c;g=0;b=x; }
  const toHex = n => Math.round((n+m)*255).toString(16).padStart(2,"0");
  return "#"+toHex(r)+toHex(g)+toHex(b);
}

function hexToHsv(hex){
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
  let h = 0;
  if(d !== 0){
    if(max===r) h = 60*(((g-b)/d)%6);
    else if(max===g) h = 60*((b-r)/d+2);
    else h = 60*((r-g)/d+4);
  }
  if(h<0) h += 360;
  const s = max===0 ? 0 : (d/max)*100;
  const v = max*100;
  return {h,s,v};
}

function ColorPicker({color, onChange}){
  const initial = hexToHsv(color);
  const [h, setH] = useState(initial.h);
  const [s, setS] = useState(initial.s);
  const [v, setV] = useState(initial.v);
  const squareRef = useRef(null);
  const stripRef = useRef(null);

  const updateFromSquare = (clientX, clientY) => {
    const rect = squareRef.current.getBoundingClientRect();
    const x = Math.min(Math.max(clientX - rect.left, 0), rect.width);
    const y = Math.min(Math.max(clientY - rect.top, 0), rect.height);
    const newS = (x/rect.width)*100;
    const newV = 100 - (y/rect.height)*100;
    setS(newS); setV(newV);
    onChange(hsvToHex(h, newS, newV));
  };
  const updateFromStrip = (clientX) => {
    const rect = stripRef.current.getBoundingClientRect();
    const x = Math.min(Math.max(clientX - rect.left, 0), rect.width);
    const newH = (x/rect.width)*360;
    setH(newH);
    onChange(hsvToHex(newH, s, v));
  };

  const dragging = useRef(null);
  const onSquareDown = (e) => {
    dragging.current = "square";
    updateFromSquare(e.clientX, e.clientY);
  };
  const onStripDown = (e) => {
    dragging.current = "strip";
    updateFromStrip(e.clientX);
  };
  useEffect(() => {
    const onMove = (e) => {
      if(!dragging.current) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      if(dragging.current === "square") updateFromSquare(clientX, clientY);
      else updateFromStrip(clientX);
    };
    const onUp = () => { dragging.current = null; };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    return () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
  }, [h, s, v]);

  const hex = hsvToHex(h, s, v);

  return (
    <div className="color-picker">
      <div
        className="sv-square"
        ref={squareRef}
        style={{background: `hsl(${h}, 100%, 50%)`}}
        onPointerDown={onSquareDown}
      >
        <div className="sv-white" />
        <div className="sv-black" />
        <div className="sv-handle" style={{left:`${s}%`, top:`${100-v}%`, background:hex}} />
      </div>
      <div className="hue-strip" ref={stripRef} onPointerDown={onStripDown}>
        <div className="hue-handle" style={{left:`${(h/360)*100}%`}} />
      </div>
      <div className="color-preview-row">
        <div className="color-preview-swatch" style={{background:hex}} />
        <div className="color-preview-hex">{hex}</div>
      </div>
    </div>
  );
}

function computeStreak(history){
  let streak = 0;
  for(let i=0;i<400;i++){
    const ds = dateStrDaysAgo(i);
    if(history[ds]){ streak++; } else { if(i===0) continue; break; }
  }
  return streak;
}

function HabitCard({habit, onToggleToday, onDelete, weeksToShow, index = 0, readOnly = false}){
  const history = habit.history || {};
  const points = Object.keys(history).length;
  const info = getLevelInfo(points);
  const streak = computeStreak(history);
  const today = todayStr();
  const todayDone = !!history[today];
  const daysShown = weeksToShow * 7;

  const prevDoneRef = useRef(todayDone);
  const prevStreakRef = useRef(streak);
  const [showPop, setShowPop] = useState(false);
  const [bumpStreak, setBumpStreak] = useState(false);
  const [rippleKey, setRippleKey] = useState(0);

  useEffect(() => {
    if(todayDone && !prevDoneRef.current){
      setShowPop(true);
      setRippleKey(k => k + 1);
      const t = setTimeout(() => setShowPop(false), 850);
      return () => clearTimeout(t);
    }
    prevDoneRef.current = todayDone;
  }, [todayDone]);

  useEffect(() => {
    if(streak > prevStreakRef.current){
      setBumpStreak(true);
      const t = setTimeout(() => setBumpStreak(false), 450);
      prevStreakRef.current = streak;
      return () => clearTimeout(t);
    }
    prevStreakRef.current = streak;
  }, [streak]);

  const cells = [];
  for(let i=daysShown-1;i>=0;i--){
    const ds = dateStrDaysAgo(i);
    cells.push({ds, done: !!history[ds], isToday: i===0});
  }

  const entranceDelay = `${index * 0.1}s`;

  return (
    <div className="habit-card" style={{animationDelay: entranceDelay}}>
      <div className="habit-topline" style={{background:habit.color, boxShadow:`0 0 8px ${hexToRgba(habit.color,0.7)}`}} />
      <div className="habit-top">
        <div className="habit-name-row">
          <div className="habit-icon">{habit.icon}</div>
          <div className="habit-meta">
            <div className="name">{habit.name}</div>
            <div className="sub">{readOnly ? (habit.sub || "View only") : (habit.sub || "Tap today's square to log it")}</div>
          </div>
        </div>
        {!readOnly && <button className="del-btn" onClick={() => onDelete(habit)}>{"\u2715"}</button>}
      </div>

      <div className="stat-row">
        <RankBadge info={info} />
        <div className={"streak-chip" + (bumpStreak ? " bump" : "")}>
          <span className={streak > 0 ? "streak-flame" : ""}>{"\uD83D\uDD25"}</span> {streak}
        </div>
        <div className="points-chip">{"\u2726"} {points}</div>
      </div>

      <div className="level-progress">
        <div className="level-progress-fill" style={{width:`${info.progress*100}%`, background:habit.color}} />
      </div>

      <div className="grid-wrap">
        {showPop && <div className="pop-plus" style={{color:habit.color}}>+1</div>}
        <div className="grid" style={{aspectRatio:`${weeksToShow} / 7`}}>
          {cells.map(c => {
            const rankColor = RANKS[info.rankIndex].grad[1];
            const baseStyle = c.done
              ? {background:habit.color, boxShadow:`0 0 6px ${hexToRgba(habit.color,0.6)}`, "--ripple-color":hexToRgba(habit.color,0.6)}
              : (c.isToday ? {"--pulse-color":rankColor, "--pulse-glow":hexToRgba(rankColor,0.7), "--ripple-color":hexToRgba(rankColor,0.6)} : {});
            const isRippling = c.isToday && showPop;
            return (
              <div
                key={c.ds + (isRippling ? `-r${rippleKey}` : "")}
                className={"cell" + (c.isToday && !readOnly ? " today" : "") + (isRippling ? " pop ripple" : "")}
                style={baseStyle}
                onClick={() => !readOnly && c.isToday && onToggleToday(habit.id)}
                title={c.ds}
              />
            );
          })}
        </div>
      </div>
    </div>
  );
}

    delay: Math.random()*2.5,
    duration: 1.5 + Math.random()*1.5,
    size: 6 + Math.random()*8,
  })), []);

  const dismiss = useCallback(() => {
    if(dismissing) return;
    setDismissing(true);
    setTimeout(onDone, 550);
  }, [dismissing, onDone]);

  useEffect(() => {
    const t = setTimeout(dismiss, 4500);
    return () => clearTimeout(t);
  }, []);

  return (
    <div className={"greeting-overlay" + (dismissing ? " dismissing" : "")} onClick={dismiss}>

      {sparkles.map((s,i) => (
        <span key={i} className="greeting-sparkle" style={{
          top:`${s.top}%`, left:`${s.left}%`,
          fontSize:s.size,
          animationDelay:`${s.delay}s`,
          animationDuration:`${s.duration}s`,
        }}>{"\u2726"}</span>
      ))}
      <div className="greeting-emoji">{greeting.emoji}</div>
      <div className="greeting-top">{greeting.top}</div>
      <div className="greeting-main">{greeting.main}</div>
      <div className="greeting-sub">{greeting.sub}</div>
      <div className="greeting-tap">Tap anywhere to continue</div>
    </div>
  );
}

// ====== LOGIN SCREEN ======
function LoginScreen({onLogin}){
  const [isRegister, setIsRegister] = useState(false);
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async () => {
    if(!username.trim() || !password) return;
    setError('');
    setLoading(true);
    try {
      const endpoint = isRegister ? '/api/register' : '/api/login';
      const data = await api('POST', endpoint, { username: username.trim(), password });
      onLogin(data.user, data.token);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const handleKeyDown = (e) => {
    if(e.key === 'Enter') handleSubmit();
  };

  return (
    <div className="auth-screen">
      <div className="auth-logo">{"\uD83D\uDD12"}</div>
      <h1 className="auth-title">The Lock-In System</h1>
      <div className="auth-card">
        <div className="auth-tabs">
          <button className={"auth-tab" + (!isRegister ? " active" : "")} onClick={() => { setIsRegister(false); setError(''); }}>Login</button>
          <button className={"auth-tab" + (isRegister ? " active" : "")} onClick={() => { setIsRegister(true); setError(''); }}>Register</button>
        </div>
        <div className="auth-form">
          <div className="field">
            <label>Username</label>
            <input type="text" value={username} onChange={e => setUsername(e.target.value)} onKeyDown={handleKeyDown} placeholder="Enter username" autoComplete="username" />
          </div>
          <div className="field">
            <label>Password</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={handleKeyDown} placeholder="Enter password" autoComplete={isRegister ? "new-password" : "current-password"} />
          </div>
          {error && <div className="auth-error">{error}</div>}
          <button className="auth-submit" onClick={handleSubmit} disabled={loading || !username.trim() || !password}>
            {loading ? 'Please wait\u2026' : (isRegister ? 'Create Account' : 'Login')}
          </button>
        </div>
      </div>
    </div>
  );
}

// ====== BOTTOM NAVIGATION ======
function BottomNav({activeTab, onTabChange, pendingCount}){
  return (
    <div className="bottom-nav">
      <button className={"nav-tab" + (activeTab === 'habits' ? " active" : "")} onClick={() => onTabChange('habits')}>
        <span className="nav-icon">{"\uD83C\uDFE0"}</span>
        <span className="nav-label">Habits</span>
      </button>
      <button className={"nav-tab" + (activeTab === 'friends' ? " active" : "")} onClick={() => onTabChange('friends')}>
        <span className="nav-icon">{"\uD83D\uDC65"}</span>
        <span className="nav-label">Friends</span>
        {pendingCount > 0 && <span className="nav-badge">{pendingCount}</span>}
      </button>
      <button className={"nav-tab" + (activeTab === 'profile' ? " active" : "")} onClick={() => onTabChange('profile')}>
        <span className="nav-icon">{"\uD83D\uDC64"}</span>
        <span className="nav-label">Profile</span>
      </button>
    </div>
  );
}

// ====== FRIENDS VIEW ======
function FriendsView({weeksToShow, onPendingCountChange}){
  const [searchQuery, setSearchQuery] = useState('');
  const [searchResults, setSearchResults] = useState([]);
  const [pendingIncoming, setPendingIncoming] = useState([]);
  const [pendingSent, setPendingSent] = useState([]);
  const [friends, setFriends] = useState([]);
  const [portfolio, setPortfolio] = useState(null);
  const [message, setMessage] = useState('');
  const [msgType, setMsgType] = useState('success');

  useEffect(() => {
    loadRequests();
    loadFriends();
  }, []);

  const showMsg = (msg, type) => {
    setMessage(msg);
    setMsgType(type || 'success');
    setTimeout(() => setMessage(''), 3500);
  };

  const loadRequests = async () => {
    try {
      const data = await api('GET', '/api/friends/requests');
      setPendingIncoming(data.incoming);
      setPendingSent(data.sent);
      if(onPendingCountChange) onPendingCountChange(data.incoming.length);
    } catch (e) {}
  };

  const loadFriends = async () => {
    try {
      const data = await api('GET', '/api/friends');
      setFriends(data.friends);
    } catch (e) {}
  };

  const searchUsers = async (q) => {
    setSearchQuery(q);
    if (q.length < 2) { setSearchResults([]); return; }
    try {
      const data = await api('GET', '/api/users/search?q=' + encodeURIComponent(q));
      setSearchResults(data.users);
    } catch (e) {}
  };

  const sendRequest = async (uname) => {
    try {
      const data = await api('POST', '/api/friends/request', { username: uname });
      showMsg(data.message, 'success');
      setSearchResults([]);
      setSearchQuery('');
      loadRequests();
      loadFriends();
    } catch (e) {
      showMsg(e.message, 'error');
    }
  };

  const acceptRequest = async (requestId) => {
    try {
      await api('POST', '/api/friends/accept/' + requestId);
      showMsg('Friend request accepted!', 'success');
      loadRequests();
      loadFriends();
    } catch (e) { showMsg(e.message, 'error'); }
  };

  const rejectRequest = async (requestId) => {
    try {
      await api('POST', '/api/friends/reject/' + requestId);
      loadRequests();
    } catch (e) {}
  };

  const viewPortfolio = async (userId) => {
    try {
      const data = await api('GET', '/api/friends/' + userId + '/portfolio');
      setPortfolio(data);
    } catch (e) { showMsg(e.message, 'error'); }
  };

  if (portfolio) {
    return (
      <div className="portfolio-view">
        <div className="portfolio-header">
          <button className="back-btn" onClick={() => setPortfolio(null)}>{"\u2190"} Back</button>
          <h2 className="portfolio-title">{portfolio.user.username}'s Portfolio</h2>
        </div>
        {portfolio.habits.length === 0 && (
          <div className="empty-state">{portfolio.user.username} hasn't added any habits yet.</div>
        )}
        {portfolio.habits.map((h, idx) => (
          <HabitCard key={h.id} habit={h} index={idx} onToggleToday={() => {}} onDelete={() => {}} weeksToShow={weeksToShow} readOnly={true} />
        ))}
      </div>
    );
  }

  return (
    <div className="friends-view">
      <h1 className="friends-title">Friends</h1>

      {message && <div className="friends-message" style={msgType === 'error' ? {color:'#ff6b6b', borderColor:'rgba(255,107,107,.2)', background:'rgba(255,107,107,.08)'} : {}}>{message}</div>}

      <div className="search-section">
        <div className="field">
          <label>Find Users</label>
          <input type="text" value={searchQuery} onChange={e => searchUsers(e.target.value)} placeholder="Search by username\u2026" />
        </div>
        {searchResults.length > 0 && (
          <div className="search-results">
            {searchResults.map(u => (
              <div key={u.id} className="user-row">
                <span className="user-avatar">{"\uD83D\uDC64"}</span>
                <span className="user-name">{u.username}</span>
                <button className="send-req-btn" onClick={() => sendRequest(u.username)}>Add Friend</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {pendingIncoming.length > 0 && (
        <div className="requests-section">
          <h3 className="section-label">Friend Requests</h3>
          {pendingIncoming.map(r => (
            <div key={r.id} className="request-card">
              <span className="user-avatar">{"\uD83D\uDC64"}</span>
              <span className="user-name">{r.username}</span>
              <div className="request-actions">
                <button className="accept-btn" onClick={() => acceptRequest(r.id)}>{"\u2713"}</button>
                <button className="reject-btn" onClick={() => rejectRequest(r.id)}>{"\u2715"}</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {pendingSent.length > 0 && (
        <div className="requests-section">
          <h3 className="section-label">Sent Requests</h3>
          {pendingSent.map(r => (
            <div key={r.id} className="request-card">
              <span className="user-avatar">{"\uD83D\uDC64"}</span>
              <span className="user-name">{r.username}</span>
              <span className="pending-label">Pending</span>
            </div>
          ))}
        </div>
      )}

      <div className="friends-section">
        <h3 className="section-label">Your Friends</h3>
        {friends.length === 0 && (
          <div className="empty-friends">No friends yet. Search for users above to add friends!</div>
        )}
        {friends.map(f => (
          <div key={f.id} className="friend-card" onClick={() => viewPortfolio(f.id)}>
            <span className="user-avatar">{"\uD83D\uDC64"}</span>
            <span className="user-name">{f.username}</span>
            <span className="view-arrow">{"\u2192"}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ====== PROFILE VIEW ======
function ProfileView({user, habits, friends, onLogout}){
  return (
    <div className="profile-view">
      <div className="profile-card">
        <div className="profile-avatar">{"\uD83D\uDC51"}</div>
        <div className="profile-username">{user.username}</div>
        <div className="profile-joined">Member since {user.created_at ? new Date(user.created_at).toLocaleDateString() : 'today'}</div>
        <div className="profile-stat-row">
          <div className="profile-stat">
            <div className="profile-stat-num">{habits}</div>
            <div className="profile-stat-label">Habits</div>
          </div>
          <div className="profile-stat">
            <div className="profile-stat-num">{friends}</div>
            <div className="profile-stat-label">Friends</div>
          </div>
        </div>
      </div>
      <button className="logout-btn" onClick={onLogout}>
        {"\uD83D\uDEAA"} Logout
      </button>
    </div>
  );
}

// ====== MAIN APP ======
function App(){
  const [authState, setAuthState] = useState('loading');
  const [currentUser, setCurrentUser] = useState(null);
  const [activeTab, setActiveTab] = useState('habits');
  const [habits, setHabits] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [celebration, setCelebration] = useState(null);
  const [weeksToShow, setWeeksToShow] = useState(10);
  const [showGreeting, setShowGreeting] = useState(false);
  const [pendingCount, setPendingCount] = useState(0);
  const [friendCount, setFriendCount] = useState(0);
  const [confirmHabit, setConfirmHabit] = useState(null);

  // Compute grid weeks
  useEffect(() => {
    const CELL_TARGET = 26;
    const GAP = 4;
    const CARD_CHROME = 64;
    function computeWeeks(){
      const cardWidth = Math.min(window.innerWidth, 480) - CARD_CHROME;
      const weeks = Math.max(6, Math.floor((cardWidth + GAP) / (CELL_TARGET + GAP)));
      setWeeksToShow(weeks);
    }
    computeWeeks();
    window.addEventListener("resize", computeWeeks);
    return () => window.removeEventListener("resize", computeWeeks);
  }, []);

  // Check auth on mount
  useEffect(() => {
    const token = getToken();
    if(!token){
      setAuthState('logged_out');
      return;
    }
    api('GET', '/api/me')
      .then(data => {
        setCurrentUser(data.user);
        setAuthState('logged_in');
        setShowGreeting(true);
      })
      .catch(() => {
        clearToken();
        setAuthState('logged_out');
      });
  }, []);

  // Load habits when logged in
  useEffect(() => {
    if(authState !== 'logged_in') return;
    loadHabits();
    loadFriendCount();
  }, [authState]);

  const loadHabits = async () => {
    try {
      const data = await api('GET', '/api/habits');
      setHabits(data.habits);
    } catch(e) {
      console.error('Failed to load habits', e);
    }
  };

  const loadFriendCount = async () => {
    try {
      const data = await api('GET', '/api/friends');
      setFriendCount(data.friends.length);
    } catch(e) {}
    try {
      const data = await api('GET', '/api/friends/requests');
      setPendingCount(data.incoming.length);
    } catch(e) {}
  };

  const handleLogin = (user, token) => {
    setToken(token);
    setCurrentUser(user);
    setAuthState('logged_in');
    setShowGreeting(true);
  };

  const handleLogout = () => {
    clearToken();
    setCurrentUser(null);
    setHabits([]);
    setAuthState('logged_out');
    setActiveTab('habits');
    setShowGreeting(false);
  };

  const addHabit = async (data) => {
    try {
      const result = await api('POST', '/api/habits', data);
      setHabits(prev => [...prev, result.habit]);
      setShowModal(false);
    } catch(e) {
      console.error('Failed to add habit', e);
    }
  };

  const toggleToday = async (habitId) => {
    const t = todayStr();
    let celebrationEvent = null;

    // Optimistic UI update
    setHabits(prev => prev.map(h => {
      if(h.id !== habitId) return h;
      const history = {...(h.history||{})};
      const wasOn = !!history[t];
      if(wasOn) delete history[t]; else history[t] = true;

      if(!wasOn){
        const oldPoints = Object.keys(h.history||{}).length;
        const newPoints = Object.keys(history).length;
        const oldInfo = getLevelInfo(oldPoints);
        const newInfo = getLevelInfo(newPoints);
        if(newInfo.level > oldInfo.level){
          celebrationEvent = {
            type: newInfo.rankIndexUncapped > oldInfo.rankIndexUncapped ? "rankup" : "levelup",
            habitName: h.name,
            info: newInfo,
            color: h.color,
          };
        }
      }
      return {...h, history};
    }));

    if(celebrationEvent) setCelebration(celebrationEvent);

    // Sync to server
    try {
      await api('POST', '/api/habits/' + habitId + '/toggle', { date: t });
    } catch(e) {
      console.error('Toggle sync failed', e);
      loadHabits();
    }
  };

  const deleteHabit = async (id) => {
    setHabits(prev => prev.filter(h => h.id !== id));
    try {
      await api('DELETE', '/api/habits/' + id);
    } catch(e) {
      console.error('Delete failed', e);
      loadHabits();
    }
  };

  const confirmDeleteHabit = () => {
    if(confirmHabit) deleteHabit(confirmHabit.id);
    setConfirmHabit(null);
  };

  // Loading state
  if(authState === 'loading'){
    return <div className="empty-state">Loading{"\u2026"}</div>;
  }

  // Not logged in
  if(authState === 'logged_out'){
    return <LoginScreen onLogin={handleLogin} />;
  }

  // Main app
  return (
    <div>
      {showGreeting && <GreetingScreen onDone={() => setShowGreeting(false)} username={currentUser ? currentUser.username : ''} />}
      <AmbientParticles count={6} />

      {activeTab === 'habits' && (
        <div>
          <div className="header">
            <h1>The Lock-In System</h1>
            <button className="add-btn" onClick={()=>setShowModal(true)}>+</button>
          </div>
          {habits.length === 0 && (
            <div className="empty-state">No habits yet.<br/>Tap + to add your first one and start filling in the grid.</div>
          )}
          {habits.map((h, idx) => (
            <HabitCard key={h.id} habit={h} index={idx} onToggleToday={toggleToday} onDelete={setConfirmHabit} weeksToShow={weeksToShow} />
          ))}
        </div>
      )}

      {activeTab === 'friends' && (
        <FriendsView weeksToShow={weeksToShow} onPendingCountChange={setPendingCount} />
      )}

      {activeTab === 'profile' && (
        <ProfileView user={currentUser} habits={habits.length} friends={friendCount} onLogout={handleLogout} />
      )}

      <BottomNav activeTab={activeTab} onTabChange={setActiveTab} pendingCount={pendingCount} />

      {showModal && <AddModal onClose={()=>setShowModal(false)} onSave={addHabit} />}
      <ConfirmDeleteModal habit={confirmHabit} onCancel={()=>setConfirmHabit(null)} onConfirm={confirmDeleteHabit} />
      <CelebrationOverlay event={celebration} onDone={() => setCelebration(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);
</script>
